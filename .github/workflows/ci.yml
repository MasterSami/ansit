name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, type-check, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ansit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --directory backend --frozen
      - name: ruff check (backend + ml)
        run: uv run --directory backend ruff check ..
      - name: ruff format
        run: uv run --directory backend ruff format --check ..
      - name: mypy
        run: uv run --directory backend mypy
      - name: Cache Quran text (Tanzil)
        uses: actions/cache@v4
        with:
          path: ml/data/tanzil
          key: tanzil-v1
      - name: Download Quran text + verify integrity
        run: uv run --project backend python ml/scripts/download_quran.py
      - name: pytest
        run: uv run --directory backend pytest -q
        env:
          ANSIT_REQUIRE_QURAN_DATA: "1" # matcher tests must run, never skip
          ANSIT_REQUIRE_DB: "1" # database tests must run, never skip
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/ansit_test

  backend-image:
    name: Backend image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/docker/backend.Dockerfile backend

  web:
    name: Web (lint, type-check, tests, e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: echo "present=$([ -f web/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: steps.detect.outputs.present == 'true'
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
      # Browser tests of the main flow, with the API mocked and a fake microphone.
      - if: steps.detect.outputs.present == 'true'
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npm run e2e -- --trace off

  mobile:
    name: Mobile (analyze, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: mobile
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test integration_test
          flutter analyze
          flutter test

  mobile-apk:
    name: Mobile (debug APK)
    runs-on: ubuntu-latest
    needs: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --debug
      # An installable build for trying the app on an Android phone.
      - uses: actions/upload-artifact@v4
        with:
          name: ansit-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
