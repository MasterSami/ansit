name: ansit

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ansit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ansit}
      POSTGRES_DB: ${POSTGRES_DB:-ansit}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: ../infra/docker/backend.Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ansit}:${POSTGRES_PASSWORD:-ansit}@postgres:5432/${POSTGRES_DB:-ansit}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    # Audio scratch space lives in RAM only (privacy: clips are never written to disk).
    tmpfs:
      - /tmp:size=64m,mode=1777
    read_only: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
