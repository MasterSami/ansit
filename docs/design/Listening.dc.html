<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>أنصِت — جارٍ الإنصات</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0E1512}
a{color:#D9B36C;text-decoration:none}a:hover{color:#E8CB91}
@keyframes ansitPulse{0%{transform:scale(.7);opacity:.7}100%{transform:scale(1.35);opacity:0}}
@keyframes ansitBar{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.ansit-pulse{animation:ansitPulse 2.4s ease-out infinite}
.ansit-pulse-2{animation:ansitPulse 2.4s ease-out .8s infinite}
.ansit-pulse-3{animation:ansitPulse 2.4s ease-out 1.6s infinite}
.ansit-bar{transform-origin:center;animation:ansitBar 1.1s ease-in-out infinite}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1512; color: #F2EDE3; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 56px 24px 0 24px">
    <span style="font-family: 'Amiri', serif; font-weight: 700; font-size: 26px; color: {{accent}}">أنصِت</span>
    <span style="display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: #16201B; border: 1px solid #2A3731; font-size: 13px; font-weight: 500; color: #F2EDE3">
      <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: #E07A5F"></span>
      ٠:٠٦
    </span>
  </header>

  <main style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; padding: 0 24px">
    <div style="position: relative; width: 300px; height: 300px; display: flex; align-items: center; justify-content: center">
      <div class="ansit-pulse" aria-hidden="true" style="position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(217,179,108,0.5)"></div>
      <div class="ansit-pulse-2" aria-hidden="true" style="position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(217,179,108,0.5)"></div>
      <div class="ansit-pulse-3" aria-hidden="true" style="position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(217,179,108,0.5)"></div>
      <div role="img" aria-label="موجة الصوت" style="position: relative; width: 176px; height: 176px; border-radius: 50%; background: #16201B; border: 1px solid rgba(217,179,108,0.45); display: flex; align-items: center; justify-content: center; gap: 5px">
        <span class="ansit-bar" style="width: 5px; height: 34px; border-radius: 3px; background: {{accent}}; animation-delay: 0s"></span>
        <span class="ansit-bar" style="width: 5px; height: 58px; border-radius: 3px; background: {{accent}}; animation-delay: .15s"></span>
        <span class="ansit-bar" style="width: 5px; height: 80px; border-radius: 3px; background: {{accent}}; animation-delay: .3s"></span>
        <span class="ansit-bar" style="width: 5px; height: 46px; border-radius: 3px; background: {{accent}}; animation-delay: .45s"></span>
        <span class="ansit-bar" style="width: 5px; height: 70px; border-radius: 3px; background: {{accent}}; animation-delay: .6s"></span>
        <span class="ansit-bar" style="width: 5px; height: 40px; border-radius: 3px; background: {{accent}}; animation-delay: .75s"></span>
        <span class="ansit-bar" style="width: 5px; height: 62px; border-radius: 3px; background: {{accent}}; animation-delay: .9s"></span>
        <span class="ansit-bar" style="width: 5px; height: 30px; border-radius: 3px; background: {{accent}}; animation-delay: 1.05s"></span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
      <h1 style="margin: 0; font-size: 24px; font-weight: 700">جارٍ الإنصات…</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.7; color: #A3AFA8; max-width: 290px">قرّب الهاتف من مصدر الصوت، ويكفي ٥ إلى ١٠ ثوانٍ من التلاوة</p>
    </div>

    <ol aria-label="مراحل التعرّف" style="list-style: none; margin: 0; padding: 16px; width: 100%; box-sizing: border-box; border-radius: 18px; background: #16201B; border: 1px solid #2A3731; display: flex; flex-direction: column; gap: 14px">
      <li style="display: flex; align-items: center; gap: 12px; font-size: 14px">
        <span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 13px; background: {{accent}}; color: #0E1512; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>
        </span>
        <span style="flex-grow: 1">التقاط الصوت وتنقيته</span>
        <span style="font-size: 12px; color: #A3AFA8">تم</span>
      </li>
      <li style="display: flex; align-items: center; gap: 12px; font-size: 14px">
        <span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 13px; border: 2px solid {{accent}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
          <span style="width: 8px; height: 8px; border-radius: 4px; background: {{accent}}"></span>
        </span>
        <span style="flex-grow: 1; font-weight: 600">مطابقة النص بآيات المصحف</span>
        <span style="font-size: 12px; color: {{accent}}">جارٍ</span>
      </li>
      <li style="display: flex; align-items: center; gap: 12px; font-size: 14px; color: #A3AFA8">
        <span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 13px; border: 2px solid #3A4842; box-sizing: border-box; flex-shrink: 0"></span>
        <span style="flex-grow: 1">التعرّف على صوت القارئ</span>
      </li>
    </ol>
  </main>

  <footer style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 0 24px 40px 24px">
    <a href="Result.dc.html" style="width: 100%; box-sizing: border-box; height: 52px; border-radius: 26px; background: #1E2A24; border: 1px solid #2A3731; color: #F2EDE3; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600">عرض النتيجة (للمعاينة)</a>
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 20px; font-size: 15px; font-weight: 500; color: #A3AFA8">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>
      إيقاف
    </a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D9B36C","options":["#D9B36C","#7FC8A9","#9DB4E8"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#D9B36C' };
  }
}
</script>
</body>
</html>
