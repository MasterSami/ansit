<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>أنصِت — صفحة القارئ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0E1512}
a{color:#D9B36C;text-decoration:none}a:hover{color:#E8CB91}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #0E1512; color: #F2EDE3; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 52px 20px 0 20px">
    <a href="Result.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 22px; background: #16201B; border: 1px solid #2A3731; color: #F2EDE3; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
    </a>
    <button type="button" aria-label="إضافة إلى القرّاء المفضّلين" style="width: 44px; height: 44px; border-radius: 22px; background: #16201B; border: 1px solid #2A3731; color: #F2EDE3; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"></path></svg>
    </button>
  </header>

  <section style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px 20px 0 20px; text-align: center">
    <div aria-hidden="true" style="width: 96px; height: 96px; border-radius: 48px; background: #16201B; border: 2px solid {{accent}}; color: {{accent}}; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 700">م ص</div>
    <h1 style="margin: 0; font-family: 'Amiri', serif; font-weight: 700; font-size: 28px; line-height: 1.3">محمد صدّيق المنشاوي</h1>
    <span style="font-size: 14px; color: #A3AFA8">مصر · ١٩٢٠ – ١٩٦٩</span>
  </section>

  <div role="tablist" aria-label="نوع التلاوة" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin: 20px 20px 0 20px; padding: 4px; border-radius: 16px; background: #16201B; border: 1px solid #2A3731">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
      <button type="button" role="tab" aria-selected="{{ t.selected }}" onClick="{{ t.pick }}" style="{{ t.style }}">{{ t.label }}</button>
    </sc-for>
  </div>

  <main style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px; padding: 16px 20px 0 20px; overflow-y: auto">
    <sc-for list="{{ surahs }}" as="s" hint-placeholder-count="5">
      <div style="{{ s.rowStyle }}">
        <span aria-hidden="true" style="width: 38px; height: 38px; border-radius: 12px; background: #1E2A24; color: #A3AFA8; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; flex-shrink: 0">{{ s.num }}</span>
        <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
          <span style="font-size: 15px; font-weight: 600">{{ s.name }}</span>
          <span style="{{ s.metaStyle }}">{{ s.meta }}</span>
        </span>
        <button type="button" aria-label="{{ s.playLabel }}" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: #1E2A24; color: #F2EDE3; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; flex-shrink: 0">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg>
        </button>
      </div>
    </sc-for>
  </main>

  <div style="padding: 12px 20px 36px 20px">
    <button type="button" style="width: 100%; height: 54px; border-radius: 27px; border: 0; background: {{accent}}; color: #0E1512; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg>
      استمع للمصحف كاملًا
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D9B36C","options":["#D9B36C","#7FC8A9","#9DB4E8"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'murattal' };
  }
  renderVals() {
    const accent = this.props.accent ?? '#D9B36C';
    const defs = [
      { id: 'murattal', label: 'المرتّل' },
      { id: 'mujawwad', label: 'المجوّد' },
      { id: 'muallim', label: 'المعلّم' }
    ];
    const tabs = defs.map((t) => {
      const on = this.state.tab === t.id;
      return {
        ...t,
        selected: on ? 'true' : 'false',
        pick: () => this.setState({ tab: t.id }),
        style: 'height: 40px; border-radius: 12px; border: 0; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; ' + (on ? 'background: ' + accent + '; color: #0E1512' : 'background: transparent; color: #A3AFA8')
      };
    });
    const row = 'display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; background: #16201B; border: 1px solid ';
    const plain = 'font-size: 12px; color: #A3AFA8';
    const list = [
      { num: '١', name: 'الفاتحة', ayat: '٧ آيات' },
      { num: '٢', name: 'البقرة', ayat: '٢٨٦ آية' },
      { num: '٣', name: 'آل عمران', ayat: '٢٠٠ آية' },
      { num: '٤', name: 'النساء', ayat: '١٧٦ آية' },
      { num: '٦٧', name: 'المُلك', ayat: '٣٠ آية', heard: true }
    ];
    const surahs = list.map((s) => ({
      ...s,
      meta: s.heard ? s.ayat + ' · تعرّفت عليها اليوم' : s.ayat,
      metaStyle: s.heard ? 'font-size: 12px; color: ' + accent : plain,
      rowStyle: row + (s.heard ? accent : '#2A3731'),
      playLabel: 'تشغيل سورة ' + s.name
    }));
    return { accent, tabs, surahs };
  }
}
</script>
</body>
</html>
