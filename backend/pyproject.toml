[project]
name = "ansit-backend"
version = "0.1.0"
description = "Ansit backend: identifies surah, ayah and reciter from a short Quran recitation clip."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "prometheus-client>=0.20",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "redis>=5.0",
    "rapidfuzz>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "asgi-lifespan>=2.1",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = ["app", "tests"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "app.*"
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = true
check_untyped_defs = true
